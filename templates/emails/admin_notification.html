<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; color: #333333; line-height: 1.6; margin: 0; padding: 20px; background-color: #f4f4f4; }
        .container { max-width: 600px; margin: 0 auto; background-color: #ffffff; padding: 30px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); border-top: 4px solid #3498db; }
        h2 { color: #2c3e50; margin-top: 0; border-bottom: 2px solid #ecf0f1; padding-bottom: 10px; }
        .field { margin-bottom: 15px; }
        .label { font-weight: bold; color: #7f8c8d; text-transform: uppercase; font-size: 11px; letter-spacing: 0.8px; }
        .value { font-size: 15px; color: #2c3e50; margin-top: 3px; }
        .message-box { background-color: #f8f9fa; border-left: 3px solid #3498db; padding: 15px; border-radius: 4px; font-style: italic; white-space: pre-wrap; margin-top: 20px; }
        .footer { font-size: 12px; color: #95a5a6; margin-top: 30px; text-align: center; border-top: 1px solid #ecf0f1; padding-top: 15px; }
    </style>
</head>
<body>
    <div class="container">
        <h2>🚨 New Contact Form Submission</h2>
        
        <div class="field">
            <div class="label">Visitor Name</div>
            <div class="value">{{ name }}</div>
        </div>
        
        <div class="field">
            <div class="label">Email Address</div>
            <div class="value"><a href="mailto:{{ email }}">{{ email }}</a></div>
        </div>
        
        <div class="field">
            <div class="label">Phone Number</div>
            <div class="value"><a href="tel:{{ phone }}">{{ phone }}</a></div>
        </div>
        
        <div class="field">
            <div class="label">Subject</div>
            <div class="value"><strong>{{ subject }}</strong></div>
        </div>
        
        <div class="field">
            <div class="label">Submission Time</div>
            <div class="value">{{ time }}</div>
        </div>
        
        <div class="field">
            <div class="label">Message</div>
            <div class="message-box">{{ message }}</div>
        </div>
        
        <div class="footer">
            This inquiry was permanently saved to your portfolio database.<br>
            Manage all messages in your <a href="{{ dashboard_url }}">Admin Dashboard</a>.
        </div>
    </div>
</body>
</html>
